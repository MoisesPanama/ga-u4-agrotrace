<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detalle Lote ' + ${lote.codigo}">Detalle Lote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-agro { background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%); color: white; padding: 1.5rem 0; }
        .info-label { font-weight: bold; color: #6c757d; }
        .badge-ok { background-color: #198754; color: white; }
        .badge-no { background-color: #dc3545; color: white; }
        .badge-espera { background-color: #ffc107; color: #000; }
    </style>
</head>
<body>
    <div class="header-agro">
        <div class="container">
            <h2>Detalle del Lote: <span th:text="${lote.codigo}">LOT-001</span></h2>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Informacion del Lote</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <span class="info-label">Codigo:</span><br>
                                <span th:text="${lote.codigo}">LOT-001</span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <span class="info-label">Estado:</span><br>
                                <span class="badge"
                                      th:classappend="${lote.estado.name() == 'ACEPTADO'} ? 'badge-ok'
                                                     : (${lote.estado.name() == 'RECHAZADO'} ? 'badge-no' : 'badge-espera')"
                                      th:text="${lote.estado}">REGISTRADO</span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <span class="info-label">Finca:</span><br>
                                <span th:text="${lote.finca?.nombre} ?: 'Sin finca'">Finca</span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <span class="info-label">Productor:</span><br>
                                <span th:text="${lote.finca?.productorNombre} ?: 'N/A'">N/A</span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <span class="info-label">Peso (kg):</span><br>
                                <span th:text="${lote.pesoKg}">1200</span>
                            </div>
                            <div class="col-md-4 mb-3">
                                <span class="info-label">Humedad (%):</span><br>
                                <span th:text="${lote.humedadPorcentaje} ?: 'N/A'">7.5</span>
                            </div>
                            <div class="col-md-4 mb-3">
                                <span class="info-label">Fermentacion (%):</span><br>
                                <span th:text="${lote.fermentacionPorcentaje} ?: 'N/A'">65</span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <span class="info-label">Fecha Recepcion:</span><br>
                                <span th:text="${#temporals.format(lote.fechaRecepcion, 'dd/MM/yyyy')}">01/01/2024</span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <span class="info-label">Certificado:</span><br>
                                <span th:text="${lote.certificado} ? 'Si' : 'No'">No</span>
                            </div>
                        </div>
                        <div th:if="${lote.observaciones != null}" class="mb-3">
                            <span class="info-label">Observaciones:</span><br>
                            <span th:text="${lote.observaciones}">N/A</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <a th:href="@{/lotes/{id}/editar(id=${lote.id})}" class="btn btn-warning w-100 mb-2">Editar Lote</a>
                        <form th:if="${lote.estado.name() != 'ANULADO'}" th:action="@{/lotes/{id}/anular(id=${lote.id})}" method="post">
                            <button type="submit" class="btn btn-danger w-100"
                                    onclick="return confirm('Anular este lote?')">Anular Lote</button>
                        </form>
                        <a th:href="@{/lotes}" class="btn btn-secondary w-100 mt-2">Volver a Lista</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
