<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTrace Quevedo - Lotes de Cacao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-agro { background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%); color: white; padding: 2rem 0; }
        .badge-ok { background-color: #198754; color: white; }
        .badge-no { background-color: #dc3545; color: white; }
        .badge-espera { background-color: #ffc107; color: #000; }
        .badge-registrado { background-color: #0dcaf0; color: #000; }
        .vacio { text-align: center; color: #6c757d; padding: 2rem; }
    </style>
</head>
<body>
    <div class="header-agro">
        <div class="container">
            <h1>AgroTrace Quevedo</h1>
            <p class="mb-0">Trazabilidad de Lotes de Cacao Fino de Aroma - Los Rios</p>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-8">
                <h2>Lista de Lotes</h2>
            </div>
            <div class="col-md-4 text-end">
                <a th:href="@{/lotes/nuevo}" class="btn btn-success">+ Nuevo Lote</a>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Filtro por estado -->
        <div class="mb-3">
            <a th:href="@{/lotes}" class="btn btn-sm"
               th:classappend="${estadoSeleccionado == null} ? 'btn-primary' : 'btn-outline-primary'">Todos</a>
            <a th:each="est : ${estados}"
               th:href="@{/lotes(estado=${est})}"
               class="btn btn-sm"
               th:classappend="${estadoSeleccionado == est} ? 'btn-primary' : 'btn-outline-primary'"
               th:text="${est}">ESTADO</a>
        </div>

        <!-- TODO-GA-04: Tabla de lotes con estado coloreado -->
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Codigo</th>
                    <th>Finca</th>
                    <th>Fecha Recepcion</th>
                    <th>Peso</th>
                    <th>Humedad</th>
                    <th>Fermentacion</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="lote : ${lotes}">
                    <td th:text="${lote.codigo}">LT-000</td>
                    <td th:text="${lote.finca?.nombre} ?: 'Sin finca'">Finca</td>
                    <td th:text="${#temporals.format(lote.fechaRecepcion, 'dd/MM/yyyy')}"></td>
                    <td th:text="${lote.pesoKg} + ' kg'">0 kg</td>
                    <td th:text="${lote.humedadPorcentaje} + ' %'">0 %</td>
                    <td th:text="${lote.fermentacionPorcentaje} + ' %'">0 %</td>
                    <td>
                        <span class="badge"
                              th:classappend="${lote.estado.name() == 'ACEPTADO'} ? 'badge-ok'
                                             : (${lote.estado.name() == 'RECHAZADO'} ? 'badge-no'
                                             : (${lote.estado.name() == 'SECADO_ADICIONAL'} ? 'badge-espera' : 'badge-registrado'))"
                              th:text="${lote.estado}">ESTADO</span>
                    </td>
                    <td>
                        <a th:href="@{/lotes/{id}(id=${lote.id})}" class="btn btn-outline-primary btn-sm">Ver</a>
                        <a th:href="@{/lotes/{id}/editar(id=${lote.id})}" class="btn btn-outline-secondary btn-sm">Editar</a>
                        <form th:if="${lote.estado.name() != 'ANULADO'}" th:action="@{/lotes/{id}/anular(id=${lote.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Anular este lote?')">Anular</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lotes)}">
                    <td colspan="8" class="vacio">No hay lotes con ese criterio.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
