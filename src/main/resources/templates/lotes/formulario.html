<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lote.id != null} ? 'Editar Lote' : 'Nuevo Lote'">Lote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-agro { background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%); color: white; padding: 1.5rem 0; }
    </style>
</head>
<body>
    <div class="header-agro">
        <div class="container">
            <h2 th:text="${lote.id != null} ? 'Editar Lote ' + ${lote.codigo} : 'Registrar Nuevo Lote'">Nuevo Lote</h2>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form th:action="${lote.id != null}
                              ? @{/lotes/{id}/actualizar(id=${lote.id})}
                              : @{/lotes}"
                              th:object="${lote}" method="post">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Codigo del Lote *</label>
                                    <input type="text" class="form-control" th:field="*{codigo}"
                                           th:disabled="${lote.id != null}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha de Recepcion *</label>
                                    <input type="date" class="form-control" th:field="*{fechaRecepcion}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('fechaRecepcion')}" th:errors="*{fechaRecepcion}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Peso (kg) *</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{pesoKg}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('pesoKg')}" th:errors="*{pesoKg}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Humedad (%)</label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{humedadPorcentaje}"
                                           min="0" max="100">
                                    <small class="text-muted">Umbral: 7.5% - Si supera, SECADO_ADICIONAL</small>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fermentacion (%)</label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{fermentacionPorcentaje}"
                                           min="0" max="100">
                                    <small class="text-muted">Umbral: 60% - Si es menor, RECHAZADO</small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Observaciones</label>
                                    <textarea class="form-control" th:field="*{observaciones}" rows="2"></textarea>
                                </div>
                            </div>

                            <div class="text-end">
                                <a th:href="@{/lotes}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">
                                    <span th:text="${lote.id != null} ? 'Actualizar' : 'Registrar'">Registrar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
