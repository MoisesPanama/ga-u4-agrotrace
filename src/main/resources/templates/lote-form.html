<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lote.id != null} ? 'Editar Lote' : 'Nuevo Lote'">Lote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-agro { background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%); color: white; padding: 1.5rem 0; }
    </style>
</head>
<body>
    <div class="header-agro">
        <div class="container">
            <h2 th:text="${lote.id != null} ? 'Editar Lote ' + ${lote.codigo} : 'Registrar Nuevo Lote'">Nuevo Lote</h2>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form th:action="${lote.id != null}
                              ? @{/lotes/{id}/actualizar(id=${lote.id})}
                              : @{/lotes}"
                              th:object="${lote}" method="post">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Codigo del Lote *</label>
                                    <input type="text" class="form-control" th:field="*{codigo}"
                                           th:disabled="${lote.id != null}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Variedad</label>
                                    <select class="form-select" th:field="*{variedad}">
                                        <option value="CRILLO">Crillo</option>
                                        <option value="NACIONAL">Nacional</option>
                                        <option value="COMUN">Comun</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre del Productor *</label>
                                    <input type="text" class="form-control" th:field="*{productorNombre}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('productorNombre')}" th:errors="*{productorNombre}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Cedula del Productor *</label>
                                    <input type="text" class="form-control" th:field="*{productorCedula}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('productorCedula')}" th:errors="*{productorCedula}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Finca</label>
                                    <input type="text" class="form-control" th:field="*{fincaNombre}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ubicacion</label>
                                    <input type="text" class="form-control" th:field="*{fincaUbicacion}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Hectareas</label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{hectareas}">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fecha de Cosecha *</label>
                                    <input type="date" class="form-control" th:field="*{fechaCosecha}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('fechaCosecha')}" th:errors="*{fechaCosecha}"></div>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fecha Procesamiento</label>
                                    <input type="date" class="form-control" th:field="*{fechaProcesamiento}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Peso (kg) *</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{pesoKg}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('pesoKg')}" th:errors="*{pesoKg}"></div>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Humedad (%)</label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{humedadPorcentaje}"
                                           min="5" max="12">
                                    <small class="text-muted">5% - 12%</small>
                                    <div class="text-danger" th:if="${#fields.hasErrors('humedadPorcentaje')}" th:errors="*{humedadPorcentaje}"></div>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fermentacion (horas)</label>
                                    <input type="number" class="form-control" th:field="*{fermentacionHoras}"
                                           min="100" max="336">
                                    <small class="text-muted">100 - 336 horas</small>
                                    <div class="text-danger" th:if="${#fields.hasErrors('fermentacionHoras')}" th:errors="*{fermentacionHoras}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Temperatura Maxima (°C)</label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{temperaturaMaxima}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Temperatura Minima (°C)</label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{temperaturaMinima}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="REGISTRADO">Registrado</option>
                                    <option value="EN_VERIFICACION">En Verificacion</option>
                                    <option value="CERTIFICADO">Certificado</option>
                                    <option value="ANULADO">Anulado</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Observaciones</label>
                                <textarea class="form-control" th:field="*{observaciones}" rows="3"></textarea>
                            </div>

                            <div class="text-end">
                                <a th:href="@{/lotes}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">
                                    <span th:text="${lote.id != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
