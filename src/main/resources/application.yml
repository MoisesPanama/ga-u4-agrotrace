server:
  port: 8080

spring:
  application:
    name: agrotrace

  datasource:
    url: jdbc:postgresql://localhost:5432/agrotrace
    username: agrotrace
    password: agrotrace2024
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 15m
      cache-null-values: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  clima:
    cache-ttl-minutes: 15
    api-url: https://api.openweathermap.org/data/2.5/weather

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
