services:
  agrotrace-db:
    image: postgres:16-alpine
    container_name: agrotrace-db
    environment:
      POSTGRES_DB: agrotrace
      POSTGRES_USER: agrotrace
      POSTGRES_PASSWORD: agrotrace2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrotrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  agrotrace-redis:
    image: redis:7-alpine
    container_name: agrotrace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
